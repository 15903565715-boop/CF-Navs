<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CF-Navs 使用指南</title>
  <meta name="description" content="CF-Navs 六步交互使用指南。" />
  <style>
    :root {
      /* 默认唯一主题：护眼主题（纸页鼠尾草 — 对应 CF-Navs 示例站点 实测默认配色） */
      --bg-page: linear-gradient(135deg, #dce6d9 0%, #cddbc9 50%, #c2d3be 100%);
      --bg-overlay: rgba(24, 34, 26, 0.50);
      --modal-bg: rgba(246, 249, 245, 0.97);
      --modal-border: rgba(94, 126, 98, 0.24);
      --modal-shadow: 0 24px 60px -12px rgba(20, 36, 23, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.72) inset;
      --stage-bg: linear-gradient(145deg, #e2ece0 0%, #d4e2d0 55%, #c8d9c3 100%);
      --stage-border: rgba(92, 124, 96, 0.22);
      --card-surface: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.82);
      --text-primary: #1f2d22;
      --text-secondary: #4a5d4d;
      --text-muted: #728575;
      --accent: #3d7a52;
      --accent-hover: #316443;
      --accent-soft: rgba(61, 122, 82, 0.12);
      --accent-glow: rgba(61, 122, 82, 0.26);
      --highlight-bar: #e85d3f;
      --badge-bg: #3d7a52;
      --badge-text: #ffffff;
      --pill-bg: rgba(255, 255, 255, 0.76);
      --pill-active: #ffffff;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font-sans);
      background: var(--bg-page);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       Simulated Live CF-Navs Homepage Background (Matches CF-Navs 示例站点)
       ========================================================================== */
    .simulated-home {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 24px 56px;
      position: relative;
    }

    /* Top Sticky Category Nav */
    .sim-top-nav {
      position: sticky;
      top: 12px;
      z-index: 20;
      max-width: 1200px;
      width: 100%;
      margin: 12px auto 0;
      padding: 8px 14px;
      border-radius: 16px;
      background: var(--card-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sim-cat-list {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sim-cat-list::-webkit-scrollbar { display: none; }

    .sim-cat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--pill-bg);
      border: 1px solid transparent;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .sim-cat-pill.active {
      background: var(--pill-active);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      padding-left: 15px;
    }

    .sim-cat-pill.active::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 3.5px;
      height: 14px;
      border-radius: 2px;
      background: var(--highlight-bar);
    }

    .sim-cat-count {
      font-size: 11px;
      opacity: 0.75;
      font-weight: 600;
    }

    /* Top-Right Floating Actions (Exact match to CF-Navs 示例站点: ⋮ -> ?, A, ⚙) */
    .sim-floating-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .sim-action-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--modal-border);
      background: var(--card-surface);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .sim-action-btn:hover {
      transform: translateY(-2px);
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .sim-action-btn.help-pulse {
      border-color: var(--accent);
      background: #e6f2ea;
      color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .sim-action-btn.help-pulse:hover {
      background: var(--accent);
      color: #fff;
    }

    .sim-floating-group {
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .sim-floating-group.collapsed {
      display: none;
    }

    /* Bottom-Right Back to Top Button (Matches CF-Navs 示例站点) */
    .sim-back-top {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--modal-border);
      background: var(--card-surface);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      transition: all 0.2s ease;
      z-index: 30;
    }

    .sim-back-top:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Hero Search Area */
    .sim-hero {
      max-width: 680px;
      width: 100%;
      margin: 38px auto 26px;
      text-align: center;
    }

    .sim-hero-title {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .sim-search-bar {
      display: flex;
      align-items: center;
      background: var(--card-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--modal-border);
      border-radius: 16px;
      padding: 6px 8px;
      box-shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.08);
      gap: 8px;
    }

    .sim-engine-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    .sim-search-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 14px;
      padding: 8px 6px;
      outline: none;
    }

    .sim-search-submit {
      padding: 8px 18px;
      border-radius: 11px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sim-search-meta {
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Simulated Bookmark Grid */
    .sim-section {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto 24px;
    }

    .sim-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .sim-section-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .sim-section-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .sim-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .sim-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--card-surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .sim-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.09);
    }

    .sim-card-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      flex-shrink: 0;
    }

    .sim-card-info {
      min-width: 0;
      flex: 1;
    }

    .sim-card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sim-card-desc {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Reopen Banner when Guide is closed */
    .reopen-banner {
      max-width: 680px;
      margin: 4px auto 24px;
      padding: 13px 18px;
      border-radius: 14px;
      background: var(--card-surface);
      border: 1px solid var(--accent);
      box-shadow: 0 10px 26px var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .reopen-banner-text {
      font-size: 13px;
      color: var(--text-primary);
    }

    .reopen-banner-actions {
      display: flex;
      gap: 8px;
    }

    /* Toast Notification for Simulated Actions */
    .sim-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f2d22;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 900;
    }

    .sim-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==========================================================================
       Scoped Guide Overlay (.guide-root) — Standalone & Host Injection Compatible
       ========================================================================== */
    .guide-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--bg-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.26s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.26s ease;
    }

    .guide-backdrop.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .guide-root {
      width: 100%;
      max-width: 820px;
      max-height: 94vh;
      background: var(--modal-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--modal-border);
      border-radius: 22px;
      box-shadow: var(--modal-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(0) scale(1);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .guide-backdrop.is-hidden .guide-root {
      transform: translateY(12px) scale(0.97);
    }

    /* Modal Header */
    .guide-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 24px;
      border-bottom: 1px solid var(--modal-border);
      gap: 12px;
    }

    .guide-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .guide-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 3px 10px var(--accent-glow);
    }

    .guide-modal-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .guide-step-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .guide-header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Bilingual Switcher: [ 中文 | EN ] */
    .guide-lang-switch {
      display: inline-flex;
      background: var(--pill-bg);
      border: 1px solid var(--modal-border);
      border-radius: 9px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 6px var(--accent-glow);
    }

    .guide-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .guide-close-btn:hover {
      background: var(--accent-soft);
      color: var(--text-primary);
    }

    /* Modal Body */
    .guide-body {
      padding: 18px 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .guide-step-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .guide-step-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }

    .guide-step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 8px var(--accent-glow);
    }

    .guide-step-heading {
      font-size: 18.5px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .guide-step-desc {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-secondary);
      padding-left: 36px;
    }

    .guide-replay-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--modal-border);
      background: var(--pill-bg);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.18s ease;
    }

    .guide-replay-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* Animated SVG Stage Container (Max height 45vh to prevent inner scrollbars) */
    .guide-stage-wrap {
      width: 100%;
      height: 350px;
      max-height: 45vh;
      min-height: 245px;
      border-radius: 16px;
      background: var(--stage-bg);
      border: 1px solid var(--stage-border);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px -6px rgba(0, 0, 0, 0.06) inset;
      user-select: none;
    }

    .guide-stage-svg {
      width: 100%;
      height: 100%;
      max-height: 45vh;
      display: block;
    }

    /* Bottom Tip Bar */
    .guide-tips-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 14px;
      border-radius: 11px;
      background: var(--accent-soft);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .guide-tip-highlight {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .kbd-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      padding: 1px 6px;
      border-radius: 5px;
      background: #ffffff;
      border: 1px solid rgba(94, 126, 98, 0.32);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    /* Modal Footer: Dots + Navigation Buttons */
    .guide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-top: 1px solid var(--modal-border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .guide-dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .guide-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      border: none;
      background: var(--text-muted);
      opacity: 0.35;
      cursor: pointer;
      padding: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .guide-dot:hover {
      opacity: 0.7;
    }

    .guide-dot.active {
      width: 26px;
      opacity: 1;
      background: var(--accent);
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .guide-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-ghost {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-ghost:hover {
      background: var(--pill-bg);
      color: var(--text-primary);
    }

    .btn-secondary {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--modal-border);
      background: var(--pill-bg);
      color: var(--text-primary);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      padding: 8px 20px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.18s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* ==========================================================================
       SVG Keyframe Animations — Pure Absolute Coordinates (No SVG transform collision)
       ========================================================================== */

    /* Step 1: Cursor clicks Search Input (x=305, y=105) -> clicks Engine Selector (x=175, y=105) */
    @keyframes step1Cursor {
      0% { transform: translate(560px, 280px) scale(1); opacity: 0; }
      10% { transform: translate(560px, 280px) scale(1); opacity: 1; }
      28% { transform: translate(305px, 105px) scale(1); }
      33% { transform: translate(305px, 105px) scale(0.92); }
      38% { transform: translate(305px, 105px) scale(1); }
      65% { transform: translate(175px, 105px) scale(1); }
      70% { transform: translate(175px, 105px) scale(0.92); }
      75% { transform: translate(175px, 105px) scale(1); opacity: 1; }
      90% { transform: translate(175px, 105px) scale(1); opacity: 1; }
      100% { transform: translate(175px, 105px) scale(1); opacity: 0; }
    }

    @keyframes step1RippleSearch {
      0%, 31% { r: 2px; opacity: 0; }
      33% { r: 5px; opacity: 0.9; }
      46%, 100% { r: 26px; opacity: 0; }
    }

    @keyframes step1RippleEngine {
      0%, 68% { r: 2px; opacity: 0; }
      70% { r: 5px; opacity: 0.9; }
      83%, 100% { r: 26px; opacity: 0; }
    }

    @keyframes step1CardPulse {
      0%, 34% { stroke-width: 1.5px; stroke: rgba(61, 122, 82, 0.35); }
      42%, 90% { stroke-width: 2.2px; stroke: #3d7a52; }
      100% { stroke-width: 1.5px; stroke: rgba(61, 122, 82, 0.35); }
    }

    /* Step 2: Cursor clicks Top Category Pill (x=312, y=54) -> then clicks Subcategory Pill (x=236, y=134) */
    @keyframes step2Cursor {
      0% { transform: translate(580px, 275px) scale(1); opacity: 0; }
      10% { transform: translate(580px, 275px) scale(1); opacity: 1; }
      30% { transform: translate(312px, 54px) scale(1); }
      35% { transform: translate(312px, 54px) scale(0.92); }
      40% { transform: translate(312px, 54px) scale(1); }
      62% { transform: translate(236px, 134px) scale(1); }
      67% { transform: translate(236px, 134px) scale(0.92); }
      72% { transform: translate(236px, 134px) scale(1); opacity: 1; }
      90% { transform: translate(236px, 134px) scale(1); opacity: 1; }
      100% { transform: translate(236px, 134px) scale(1); opacity: 0; }
    }

    @keyframes step2Ripple1 {
      0%, 33% { r: 2px; opacity: 0; }
      35% { r: 5px; opacity: 0.9; }
      48%, 100% { r: 26px; opacity: 0; }
    }

    @keyframes step2Ripple2 {
      0%, 65% { r: 2px; opacity: 0; }
      67% { r: 5px; opacity: 0.9; }
      80%, 100% { r: 26px; opacity: 0; }
    }

    /* Step 3: Cursor right-clicks Bookmark Card (x=155, y=110) -> clicks "编辑" (x=215, y=162) -> moves to Save button (x=678, y=274) */
    @keyframes step3Cursor {
      0% { transform: translate(110px, 265px) scale(1); opacity: 0; }
      10% { transform: translate(110px, 265px) scale(1); opacity: 1; }
      28% { transform: translate(155px, 110px) scale(1); }
      33% { transform: translate(155px, 110px) scale(0.92); }
      38% { transform: translate(155px, 110px) scale(1); }
      56% { transform: translate(215px, 162px) scale(1); }
      61% { transform: translate(215px, 162px) scale(0.92); }
      66% { transform: translate(215px, 162px) scale(1); opacity: 1; }
      88% { transform: translate(678px, 274px) scale(1); opacity: 1; }
      100% { transform: translate(678px, 274px) scale(1); opacity: 0; }
    }

    @keyframes step3RippleCard {
      0%, 31% { r: 2px; opacity: 0; }
      33% { r: 5px; opacity: 0.9; }
      46%, 100% { r: 26px; opacity: 0; }
    }

    @keyframes step3RippleMenu {
      0%, 59% { r: 2px; opacity: 0; }
      61% { r: 5px; opacity: 0.9; }
      74%, 100% { r: 24px; opacity: 0; }
    }

    /* Step 4: Keyboard Key Press & Spotlight Active Row Highlight */
    @keyframes step4KeyBounce {
      0%, 12% { transform: translateY(0px); }
      18%, 26% { transform: translateY(3px); }
      34%, 100% { transform: translateY(0px); }
    }

    @keyframes step4RowMove {
      0%, 38% { transform: translateY(0px); }
      48%, 72% { transform: translateY(44px); }
      82%, 96% { transform: translateY(88px); }
      100% { transform: translateY(0px); }
    }

    /* Step 5: Cursor clicks Deep Ocean Swatch (x=275, y=90) -> clicks Eye-Care Sage Swatch (x=275, y=180) -> clicks Detailed Card Button (x=279, y=266) */
    @keyframes step5Cursor {
      0% { transform: translate(620px, 285px) scale(1); opacity: 0; }
      10% { transform: translate(620px, 285px) scale(1); opacity: 1; }
      30% { transform: translate(275px, 90px) scale(1); }
      35% { transform: translate(275px, 90px) scale(0.92); }
      40% { transform: translate(275px, 90px) scale(1); }
      62% { transform: translate(275px, 180px) scale(1); }
      67% { transform: translate(275px, 180px) scale(0.92); }
      72% { transform: translate(275px, 180px) scale(1); opacity: 1; }
      90% { transform: translate(279px, 266px) scale(1); opacity: 1; }
      100% { transform: translate(279px, 266px) scale(1); opacity: 0; }
    }

    @keyframes step5Ripple1 {
      0%, 33% { r: 2px; opacity: 0; }
      35% { r: 5px; opacity: 0.9; }
      48%, 100% { r: 26px; opacity: 0; }
    }

    @keyframes step5Ripple2 {
      0%, 65% { r: 2px; opacity: 0; }
      67% { r: 5px; opacity: 0.9; }
      80%, 100% { r: 26px; opacity: 0; }
    }

    /* Step 6: Cursor clicks Top-Right ⋮ (x=702, y=46) -> clicks Circular ? Button (x=702, y=104) */
    @keyframes step6Cursor {
      0% { transform: translate(480px, 240px) scale(1); opacity: 0; }
      10% { transform: translate(480px, 240px) scale(1); opacity: 1; }
      28% { transform: translate(702px, 46px) scale(1); }
      33% { transform: translate(702px, 46px) scale(0.92); }
      38% { transform: translate(702px, 46px) scale(1); }
      58% { transform: translate(702px, 104px) scale(1); }
      64% { transform: translate(702px, 104px) scale(0.91); }
      70% { transform: translate(702px, 104px) scale(1); opacity: 1; }
      90% { transform: translate(702px, 104px) scale(1); opacity: 1; }
      100% { transform: translate(702px, 104px) scale(1); opacity: 0; }
    }

    @keyframes step6RippleMenu {
      0%, 31% { r: 2px; opacity: 0; }
      33% { r: 5px; opacity: 0.9; }
      45%, 100% { r: 24px; opacity: 0; }
    }

    @keyframes step6RippleHelp {
      0%, 61% { r: 4px; opacity: 0; }
      64% { r: 7px; opacity: 0.95; }
      82%, 100% { r: 30px; opacity: 0; }
    }

    .anim-cursor-s1 { animation: step1Cursor 5s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .anim-ripple1-s1 { animation: step1RippleSearch 5s ease-out infinite; }
    .anim-ripple2-s1 { animation: step1RippleEngine 5s ease-out infinite; }
    .anim-card-s1 { animation: step1CardPulse 5s ease-in-out infinite; }

    .anim-cursor-s2 { animation: step2Cursor 5s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .anim-ripple1-s2 { animation: step2Ripple1 5s ease-out infinite; }
    .anim-ripple2-s2 { animation: step2Ripple2 5s ease-out infinite; }

    .anim-cursor-s3 { animation: step3Cursor 5s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .anim-ripple1-s3 { animation: step3RippleCard 5s ease-out infinite; }
    .anim-ripple2-s3 { animation: step3RippleMenu 5s ease-out infinite; }

    .anim-key-s4 { animation: step4KeyBounce 5s ease-in-out infinite; }
    .anim-row-s4 { animation: step4RowMove 5s cubic-bezier(0.22, 1, 0.36, 1) infinite; }

    .anim-cursor-s5 { animation: step5Cursor 5s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .anim-ripple1-s5 { animation: step5Ripple1 5s ease-out infinite; }
    .anim-ripple2-s5 { animation: step5Ripple2 5s ease-out infinite; }

    .anim-cursor-s6 { animation: step6Cursor 5s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .anim-ripple1-s6 { animation: step6RippleMenu 5s ease-out infinite; }
    .anim-ripple2-s6 { animation: step6RippleHelp 5s ease-out infinite; }

    @media (max-width: 640px) {
      .guide-backdrop {
        padding: 8px;
      }
      .guide-root {
        max-height: 96vh;
        border-radius: 18px;
      }
      .guide-header {
        padding: 12px 16px;
      }
      .guide-body {
        padding: 14px 16px 12px;
      }
      .guide-step-desc {
        padding-left: 0;
        font-size: 13px;
      }
      .guide-stage-wrap {
        height: 250px;
      }
      .guide-footer {
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       1. SIMULATED CF-NAVS LIVE HOMEPAGE (Default Eye-Care Sage Green Theme)
       ========================================================================== -->
  <div class="simulated-home" id="simulatedHome">
    <!-- Top Sticky Category Bar (Matches CF-Navs 示例站点) -->
    <header class="sim-top-nav" aria-label="分类导航栏">
      <div class="sim-cat-list" id="simCategoryBar">
        <button type="button" class="sim-cat-pill active" data-cat="all">
          <span>全部导航</span>
        </button>
        <button type="button" class="sim-cat-pill" data-cat="cf">
          <span>CF-Navs项目地址</span>
          <span class="sim-cat-count">5</span>
        </button>
        <button type="button" class="sim-cat-pill" data-cat="forum">
          <span>论坛导航</span>
          <span class="sim-cat-count">2</span>
        </button>
        <button type="button" class="sim-cat-pill" data-cat="ai">
          <span>Ai服务</span>
          <span class="sim-cat-count">27 ▼</span>
        </button>
        <button type="button" class="sim-cat-pill" data-cat="mac">
          <span>MAC</span>
          <span class="sim-cat-count">45</span>
        </button>
        <button type="button" class="sim-cat-pill" data-cat="dev">
          <span>编程</span>
          <span class="sim-cat-count">54 ▼</span>
        </button>
        <button type="button" class="sim-cat-pill" data-cat="study">
          <span>学习</span>
          <span class="sim-cat-count">34</span>
        </button>
      </div>

      <!-- Top-Right Floating Actions (Matches CF-Navs 示例站点: ⋮ -> ?, A, ⚙) -->
      <div class="sim-floating-wrap">
        <div class="sim-floating-group" id="simFloatingGroup">
          <button type="button" class="sim-action-btn help-pulse" id="reopenGuideBtn" aria-label="使用指南" title="打开使用指南 (?)">
            ?
          </button>
          <button type="button" class="sim-action-btn" id="simThemeBtn" aria-label="切换主题" title="切换主题 (A)">
            A
          </button>
          <button type="button" class="sim-action-btn" id="simAdminBtn" aria-label="管理员入口" title="管理员登录或进入后台 (⚙)">
            ⚙
          </button>
        </div>
        <button type="button" class="sim-action-btn" id="simMenuToggleBtn" aria-label="收起快捷菜单" aria-expanded="true" aria-controls="simFloatingGroup" title="收起右上角快捷菜单 (⋮)">
          ⋮
        </button>
      </div>
    </header>

    <!-- Hero Search Section (HomeHeroSearch) -->
    <section class="sim-hero">
      <h1 class="sim-hero-title">CF-Navs（护眼主题）</h1>
      <div class="sim-search-bar">
        <button type="button" class="sim-engine-btn" id="simEngineBtn" title="点击切换外部搜索引擎">
          <span id="simEngineLabel">Google</span>
          <span>▾</span>
        </button>
        <input
          type="text"
          class="sim-search-input"
          id="simSearchInput"
          placeholder="输入关键词搜索"
          aria-label="输入关键词搜索"
        />
        <button type="button" class="sim-search-submit" id="simSearchSubmitBtn">搜索</button>
      </div>
      <div class="sim-search-meta" id="simSearchMeta">
        <span>• 当前内容 匹配 <strong>6</strong> 个分类, <strong>8</strong> 个站点</span>
        <span>｜</span>
        <span>按 <kbd class="kbd-key">Ctrl+K</kbd> 或 <kbd class="kbd-key">/</kbd> 唤起全局 Spotlight</span>
      </div>
    </section>

    <!-- Status Banner when Guide Modal is Closed -->
    <div class="reopen-banner" id="reopenBanner">
      <div class="reopen-banner-text">
        此处是交互示意页，示例书签与设置不会读取或修改真实数据。要进入实际导航页，请使用“返回导航首页”。
      </div>
      <div class="reopen-banner-actions">
        <button type="button" class="btn-secondary" id="resetFirstVisitBtn">模拟首次访问（重置并弹出）</button>
        <button type="button" class="btn-primary" id="bannerOpenGuideBtn">打开使用指南</button>
        <a class="btn-secondary" href="/">返回导航首页</a>
      </div>
    </div>

    <!-- Frequently Visited Bookmark Cards -->
    <section class="sim-section">
      <div class="sim-section-header">
        <div class="sim-section-title">
          <span>经常访问</span>
          <span class="sim-section-badge" id="simCardCountBadge">共 8 个站点</span>
        </div>
      </div>
      <div class="sim-grid" id="simBookmarkGrid">
        <!-- Populated dynamically by JS -->
      </div>
    </section>

    <button type="button" class="sim-back-top" id="simBackTopBtn" aria-label="返回顶部" title="返回顶部 (^)">
      ^
    </button>
  </div>

  <div class="sim-toast" id="simToast" role="status" aria-live="polite"></div>

  <!-- ==========================================================================
       2. FIRST-VISIT USER ONBOARDING GUIDE MODAL (.guide-root)
       ========================================================================== -->
  <div class="guide-backdrop" id="guideBackdrop" role="dialog" aria-modal="true" aria-labelledby="guideModalTitle">
    <div class="guide-root" id="guideRoot">
      <!-- Top Bar -->
      <header class="guide-header">
        <div class="guide-brand">
          <span class="guide-logo">CF</span>
          <h2 class="guide-modal-title" id="guideModalTitle">使用指南</h2>
          <span class="guide-step-pill" id="guideStepCounter">第 1 / 6 步</span>
        </div>

        <div class="guide-header-controls">
          <!-- Bilingual Switcher [ 中文 | EN ] -->
          <div class="guide-lang-switch" role="group" aria-label="语言切换">
            <button type="button" class="lang-btn active" id="langZhBtn" data-lang="zh">中文</button>
            <button type="button" class="lang-btn" id="langEnBtn" data-lang="en">EN</button>
          </div>

          <!-- Close Button -->
          <button type="button" class="guide-close-btn" id="guideCloseBtn" aria-label="关闭指南" title="关闭 (Esc)">
            ✕
          </button>
        </div>
      </header>

      <!-- Step Content & Animated SVG Stage -->
      <main class="guide-body" id="guideTouchArea">
        <div class="guide-step-header">
          <div>
            <div class="guide-step-title-row">
              <span class="guide-step-num" id="stepNumberBadge">1</span>
              <h3 class="guide-step-heading" id="stepHeading">搜索，一触即达</h3>
            </div>
            <p class="guide-step-desc" id="stepDescription">
              在顶部搜索框输入关键词，即时过滤全站分类与书签；左侧下拉按钮可切换已配置的外部搜索引擎。
            </p>
          </div>

          <button type="button" class="guide-replay-btn" id="replayAnimBtn" title="重新播放当前步骤动效">
            <span>↻</span>
            <span id="replayBtnLabel">重播动效</span>
          </button>
        </div>

        <!-- Animated Illustration Stage -->
        <div class="guide-stage-wrap" id="guideStageWrap" aria-live="polite">
          <!-- Step SVG injected here -->
        </div>

        <!-- Contextual Operation Tip Bar -->
        <div class="guide-tips-bar">
          <div class="guide-tip-highlight" id="stepQuickTip">
            实测细节：输入关键词后自动出现 × 清空按钮，并在下方实时统计“当前内容 匹配 X 个分类, Y 个站点”。
          </div>
          <div id="keyboardHintText">
            键盘 <kbd class="kbd-key">◀</kbd> <kbd class="kbd-key">▶</kbd> 切换步骤 · <kbd class="kbd-key">Esc</kbd> 关闭
          </div>
        </div>
      </main>

      <!-- Footer: Progress Dots + Skip / Prev / Next -->
      <footer class="guide-footer">
        <div class="guide-dots" id="guideDotsContainer" role="tablist" aria-label="指南步骤指示器">
          <!-- 6 dots rendered by JS -->
        </div>

        <div class="guide-actions">
          <button type="button" class="btn-ghost" id="guideSkipBtn">跳过</button>
          <button type="button" class="btn-secondary" id="guidePrevBtn" disabled>上一步</button>
          <button type="button" class="btn-primary" id="guideNextBtn">下一步</button>
        </div>
      </footer>
    </div>
  </div>

    <script src="./guide.js" defer></script>
</body>
</html>
