<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
    <rect width="1280" height="800" fill="#f1f5f9"/>
    
    <rect x="0" y="0" width="1280" height="64" fill="#e2e8f0"/>
    <circle cx="28" cy="32" r="8" fill="#f87171"/><circle cx="52" cy="32" r="8" fill="#fbbf24"/><circle cx="76" cy="32" r="8" fill="#34d399"/>
    <rect x="110" y="16" width="600" height="32" rx="16" fill="#ffffff"/>
    <text x="130" y="38" font-size="16" fill="#64748b" font-family="Noto Sans CJK SC, sans-serif">cf-navs.pages.dev</text>
    
    <rect x="20" y="84" width="1240" height="696" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <rect x="20" y="84" width="1240" height="696" rx="16" fill="#000000" opacity="0.06"/>
    <rect x="340" y="180" width="600" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="370" y="210" width="540" height="52" rx="10" fill="#f1f5f9"/>
    <text x="390" y="243" font-size="17" fill="#64748b" font-family="Noto Sans CJK SC, sans-serif">Spotlight 搜索…</text>
    <rect x="370" y="280" width="540" height="60" rx="8" fill="#eff6ff"/>
    <text x="390" y="306" font-size="16" fill="#0f172a" font-family="Noto Sans CJK SC, sans-serif">G  GitHub — 代码托管</text>
    <text x="390" y="330" font-size="13" fill="#64748b" font-family="Noto Sans CJK SC, sans-serif">github.com</text>
    <rect x="370" y="350" width="540" height="60" rx="8" fill="transparent"/>
    <text x="390" y="376" font-size="16" fill="#0f172a" font-family="Noto Sans CJK SC, sans-serif">M  MDN — Web 文档</text>
    <rect x="370" y="420" width="540" height="60" rx="8" fill="transparent"/>
    <text x="390" y="446" font-size="16" fill="#0f172a" font-family="Noto Sans CJK SC, sans-serif">V  Vite — 构建工具</text>
    <rect x="370" y="500" width="540" height="40" rx="8" fill="#f1f5f9"/>
    <text x="640" y="526" font-size="15" fill="#64748b" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">按 Ctrl+K / ⌘K / / 随时唤起</text>
    
    <circle cx="150" cy="150" r="22" fill="#2563eb"/>
    <text x="150" y="158" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">4</text>
    
    
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.04;0.84;0.92;1"
        dur="5s" repeatCount="indefinite"/>
      <g>
        <animateMotion dur="5s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.32;1" keySplines="0.22 0.61 0.21 1;0 0 1 1"
          path="M170,640 Q428.1,507.9 640,310"/>
        <g>
          <!-- 悬停微调：落点后 2px 漂移 -->
          <animateTransform attributeName="transform" type="translate"
            values="0 0;0 0;2 1;0 0;0 0" keyTimes="0;0.32;0.36;0.40;1"
            dur="5s" repeatCount="indefinite" additive="sum"/>
          <g>
            <!-- 轻点：0.94 微缩，0.15s -->
            <animateTransform attributeName="transform" type="scale"
              values="1;1;0.94;1;1" keyTimes="0;0.375;0.405;0.44;1"
              dur="5s" repeatCount="indefinite"/>
            <path d="M0,0 L0,24 L6.5,17.5 L9.5,25 L13,23.2 L10,15.5 L16.5,15.5 Z"
              fill="#ffffff" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round"/>
          </g>
        </g>
      </g>
      <!-- 点击波纹：与轻点同步 -->
      <circle cx="640" cy="310" r="5" fill="none" stroke="#2563eb" stroke-width="2.5">
        <animate attributeName="r" values="5;5;30;30" keyTimes="0;0.405;0.55;1"
          dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.7;0" keyTimes="0;0.405;0.44;0.58"
          dur="5s" repeatCount="indefinite"/>
      </circle>
      <!-- 落点闪点 -->
      <circle cx="640" cy="310" r="3" fill="#2563eb">
        <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.405;0.43;0.50"
          dur="5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;3;5;5" keyTimes="0;0.405;0.46;1"
          dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
    

    </svg>