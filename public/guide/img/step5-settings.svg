    <rect x="300" y="215" width="180" height="96" rx="10" fill="url(#g深海蔚蓝)" stroke="#2563eb" stroke-width="3"/>
    <defs><linearGradient id="g深海蔚蓝" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient></defs>
    <text x="390" y="333" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">深海蔚蓝</text>
    <circle cx="468" cy="233" r="12" fill="#2563eb"/><text x="468" y="238" font-size="14" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">✓</text>
    
    
    <rect x="500" y="215" width="180" height="96" rx="10" fill="url(#g紫晶破晓)" stroke="#e2e8f0" stroke-width="2"/>
