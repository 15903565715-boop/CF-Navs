    <text x="790" y="333" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">余烬夜航</text>
    
    
    
    <rect x="900" y="215" width="180" height="96" rx="10" fill="url(#g极光苔原)" stroke="#e2e8f0" stroke-width="2"/>
