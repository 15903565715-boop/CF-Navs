    <text x="990" y="333" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">极光苔原</text>
    
    
    <text x="300" y="390" font-size="15" fill="#64748b" font-family="Noto Sans CJK SC, sans-serif">深色 / 浅色跟随系统，也可在右上角一键切换</text>
    
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 13.0 5.3; 0 0" dur="1.6s" repeatCount="indefinite"/>
      <defs><marker id="ah5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/></marker></defs>
      <line x1="150" y1="130" x2="420" y2="240" stroke="#ef4444" stroke-width="6" marker-end="url(#ah5)"/>
      <circle cx="150" cy="130" r="22" fill="#ef4444">
        <animate attributeName="r" values="22;26;22" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="150" y="138" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">5</text>
    </g>
    

    </svg>