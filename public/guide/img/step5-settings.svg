    <text x="590" y="333" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">紫晶破晓</text>
    
    
    
    <rect x="700" y="215" width="180" height="96" rx="10" fill="url(#g余烬夜航)" stroke="#e2e8f0" stroke-width="2"/>
