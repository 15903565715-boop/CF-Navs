    <text x="990" y="333" font-size="14" fill="#0f172a" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">极光苔原</text>
    
    
    <text x="300" y="390" font-size="15" fill="#64748b" font-family="Noto Sans CJK SC, sans-serif">深色 / 浅色跟随系统，也可在右上角一键切换</text>
    
    <circle cx="150" cy="620" r="22" fill="#2563eb"/>
    <text x="150" y="628" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif">5</text>
    
    
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.06;0.88;0.94;1"
        dur="4.2s" repeatCount="indefinite"/>
      <g>
        <animateMotion dur="4.2s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.34;1" keySplines="0.35 0 0.25 1;0 0 1 1"
          path="M150,480 C400.0,281.5 400.0,281.5 390,263"/>
        <g>
          <animateTransform attributeName="transform" type="scale"
            values="1;1;0.78;1;1" keyTimes="0;0.36;0.42;0.50;1"
            dur="4.2s" repeatCount="indefinite"/>
          <path d="M0,0 L0,24 L6.5,17.5 L9.5,25 L13,23.2 L10,15.5 L16.5,15.5 Z"
            fill="#ffffff" stroke="#1e293b" stroke-width="1.8" stroke-linejoin="round"/>
        </g>
      </g>
      <circle cx="390" cy="263" r="6" fill="none" stroke="#2563eb" stroke-width="3">
        <animate attributeName="r" values="6;6;36;36" keyTimes="0;0.42;0.58;1"
          dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.85;0" keyTimes="0;0.42;0.46;0.62"
          dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="390" cy="263" r="6" fill="none" stroke="#2563eb" stroke-width="2">
        <animate attributeName="r" values="6;6;24;24" keyTimes="0;0.44;0.58;1"
          dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.5;0" keyTimes="0;0.44;0.48;0.60"
          dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    

    </svg>