<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
    <rect width="1280" height="800" fill="#f1f5f9"/>
    
    <rect x="0" y="0" width="1280" height="64" fill="#e2e8f0"/>
    <circle cx="28" cy="32" r="8" fill="#f87171"/><circle cx="52" cy="32" r="8" fill="#fbbf24"/><circle cx="76" cy="32" r="8" fill="#34d399"/>
    <rect x="110" y="16" width="600" height="32" rx="16" fill="#ffffff"/>
