name: Translate README

on:
  push:
    branches:
      - develop
    paths:
      - README.md
      - .github/workflows/translate-readme.yml
  workflow_dispatch:
    inputs:
      language:
        description: Target language
        type: choice
        options:
          - en
        default: en
        required: true
      preview:
        description: Preview only (no provider API call or pull request)
        type: boolean
        default: true

concurrency:
  group: translate-readme-${{ inputs.language || 'en' }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      LANGUAGE: ${{ inputs.language || 'en' }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          persist-credentials: false

      - name: Preview README translation
        id: preview
        uses: Azure/co-op-translator@e9fae997bc583cae8bc2bd7203b771ddff8e0ac7 # main, reviewed 2026-10-18
        with:
          language-codes: ${{ env.LANGUAGE }}
          readme-only: "true"
          dry-run: "true"

      - name: Set up Python
        if: ${{ !inputs.preview }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Co-op Translator
        if: ${{ !inputs.preview }}
        run: |
          python -m pip install --upgrade pip
          pip install co-op-translator

      - name: Translate README
        id: translate
        if: ${{ !inputs.preview }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL_ID: ${{ secrets.OPENAI_CHAT_MODEL_ID }}
          OPENAI_ORG_ID: ${{ secrets.OPENAI_ORG_ID }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_MODEL_NAME: ${{ secrets.AZURE_OPENAI_MODEL_NAME }}
          AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: translate -l "$LANGUAGE" --readme-only --yes

      - name: Review README translation
        id: review
        if: ${{ !cancelled() && !inputs.preview && steps.preview.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          co-op-review -l "$LANGUAGE" --readme-only --format github | tee "$RUNNER_TEMP/readme-review.md"

      - name: Summarize results
        if: ${{ always() }}
        shell: bash
        env:
          PREVIEW_ONLY: ${{ inputs.preview }}
          PREVIEW_STATUS: ${{ steps.preview.outcome }}
          TRANSLATE_STATUS: ${{ steps.translate.outcome }}
          REVIEW_STATUS: ${{ steps.review.outcome }}
        run: |
          {
            echo '# README translation'
            echo
            printf 'Source: `README.md` -> `translations/%s/README.md`\n\n' "$LANGUAGE"
            printf 'Preview: **%s**; translation: **%s**; review: **%s**.\n\n' \
              "$PREVIEW_STATUS" "$TRANSLATE_STATUS" "$REVIEW_STATUS"
            if [ "$PREVIEW_ONLY" = "true" ]; then
              echo 'Preview only. Configure one text provider and rerun with Preview only unchecked.'
            else
              echo '## Changed files'
              echo
              files=$(git ls-files --modified --others --exclude-standard -- \
                "translations/$LANGUAGE/README.md" "translations/$LANGUAGE/.co-op-translator.json")
              if [ -n "$files" ]; then
                while IFS= read -r file; do printf -- '- `%s`\n' "$file"; done <<< "$files"
              else
                echo 'No translation changes. No new pull request is needed.'
              fi
              echo
              if [ -f "$RUNNER_TEMP/readme-review.md" ]; then
                cat "$RUNNER_TEMP/readme-review.md"
              fi
              echo
              echo 'Review translation wording before merging.'
            fi
          } > "$RUNNER_TEMP/readme-pr.md"
          cat "$RUNNER_TEMP/readme-pr.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create translation pull request
        id: pr
        if: ${{ !inputs.preview && steps.translate.outcome == 'success' && steps.review.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: co-op-translator/readme-${{ inputs.language || 'en' }}
          base: develop
          title: "docs: translate README to ${{ inputs.language || 'en' }}"
          commit-message: "docs: translate README to ${{ inputs.language || 'en' }}"
          body-path: ${{ runner.temp }}/readme-pr.md
          add-paths: |
            translations/${{ inputs.language || 'en' }}/README.md
            translations/${{ inputs.language || 'en' }}/.co-op-translator.json
          delete-branch: true

      - name: Show pull request
        if: ${{ steps.pr.outputs.pull-request-url != '' }}
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: printf '\n[Review translation pull request](%s)\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
